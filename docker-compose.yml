services:
  db:
    image: postgres:16-alpine
    container_name: sicad_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sicad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicad_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sicad}
    ports:
      - "5432:5432"
    volumes:
      - sicad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sicad}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sicad_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sicad}:${POSTGRES_PASSWORD:-sicad_pass}@db:5432/${POSTGRES_DB:-sicad}?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      # Zona horaria local: los filtros "Hoy" y la agrupación por día de las
      # gráficas se calculan en hora de México, no en UTC.
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npm run seed && npm start"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* se hornea en tiempo de BUILD (no en runtime), por eso va como build arg.
        # Vacío = mismo origen (/api), que Next reenvía al backend vía rewrites.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        # Destino del proxy: Next hornea el rewrite en el build (ver Dockerfile).
        BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
    container_name: sicad_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      # Destino del proxy: el servidor de Next reenvía /api al backend (red interna de Docker).
      BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
    ports:
      - "3000:3000"

volumes:
  sicad_pgdata:
