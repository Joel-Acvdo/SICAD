# ============================================================================
# SICAD — orquestación de los tres servicios.
#
# TODO EN UNA MÁQUINA (lo normal para desarrollar):
#     docker compose up -d --build
#
# REPARTIDO EN TRES LAPTOPS (red de la Familia 4, ver RED-DISTRIBUIDA.md):
# Cada laptop levanta SOLO su servicio nombrandolo:
#     laptop de BD        →  docker compose up -d db
#     laptop del backend  →  docker compose up -d --build backend
#     laptop del frontend →  docker compose up -d --build frontend
#
# Los servicios ya no dependen entre si (depends_on), asi que cada uno puede
# arrancar por separado en su propia maquina.
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: sicad_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sicad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicad_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sicad}
    ports:
      # 0.0.0.0 para que el backend pueda alcanzarla desde OTRA laptop.
      - "5432:5432"
    volumes:
      - sicad_pgdata:/var/lib/postgresql/data
      # cert/ siempre existe (vacío en dev). El entrypoint auto-detecta bd.key:
      # si está, enciende SSL; si no, arranca Postgres normal.
      - ./cert:/etc/sicad/cert:ro
      - ./db/ssl-entrypoint.sh:/usr/local/bin/sicad-ssl-entrypoint.sh:ro
    # Se invoca con "sh" para no depender del bit de ejecución (bind-mount Windows).
    entrypoint: ["sh", "/usr/local/bin/sicad-ssl-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sicad}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sicad_backend
    restart: unless-stopped
    environment:
      # Si NO se define DATABASE_URL, el backend busca la BD solo:
      # DNS bd.fandite.com → IP 192.168.13.3 → localhost (ver config/destinos.js).
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST_DNS: ${DB_HOST_DNS:-bd.fandite.com}
      DB_HOST_IP: ${DB_HOST_IP:-192.168.13.3}
      POSTGRES_USER: ${POSTGRES_USER:-sicad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicad_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sicad}
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      # SSL hacia Postgres: on = el backend exige conexión cifrada y valida la
      # cadena contra ca.crt (ver src/config/destinos.js). Vacío/off en dev.
      DB_SSL: ${DB_SSL:-}
      DB_CA_FILE: ${DB_CA_FILE:-/app/cert/ca.crt}
      # Zona horaria local: los filtros "Hoy" y la agrupación por día de las
      # gráficas se calculan en hora de México, no en UTC.
      TZ: ${TZ:-America/Mexico_City}
    ports:
      # El 4000 es el puerto que busca el frontend por defecto (ver
      # frontend/src/lib/backendDestino.js). Si lo cambias aquí, hay que
      # avisarle al frontend con BACKEND_URL en su .env.
      - "4000:4000"
    volumes:
      # El directorio cert/ siempre existe (vacío en dev). Da acceso a ca.crt
      # para validar la conexión SSL a Postgres cuando DB_SSL=on.
      - ./cert:/app/cert:ro
    # Resuelve la BD, migra, siembra y arranca (ver backend/scripts/iniciar.js).
    command: node scripts/iniciar.js

  # Nginx que termina TLS delante del backend Express. Perfil "tls" (ver notas
  # del frontend-proxy). Laptop del backend:
  #   docker compose up -d --build backend backend-proxy
  backend-proxy:
    image: nginx:1.27-alpine
    container_name: sicad_backend_proxy
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - backend
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./cert/backend.crt:/etc/nginx/certs/backend.crt:ro
      - ./cert/backend.key:/etc/nginx/certs/backend.key:ro
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        # Otros contenedores resuelven backend.fandite.com → este proxy (útil
        # para pruebas todo-en-una-máquina; en el despliegue real lo hace el DNS).
        aliases:
          - backend.fandite.com

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* se hornea en tiempo de BUILD (no en runtime).
        # Vacío = mismo origen (/api), que el proxy de Next reenvía al backend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: sicad_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      # Si NO se define BACKEND_URL, el frontend busca el backend solo:
      # DNS backend.fandite.com → IP 192.168.13.2 → localhost, revalidando
      # cada 30 s (ver src/lib/backendDestino.js).
      BACKEND_URL: ${BACKEND_URL:-}
      BACKEND_HOST_DNS: ${BACKEND_HOST_DNS:-backend.fandite.com}
      BACKEND_HOST_IP: ${BACKEND_HOST_IP:-192.168.13.2}
      # El servidor de Next confía en nuestra CA para llamar al backend por
      # HTTPS (https://backend.fandite.com). Si el archivo no existe (dev), Node
      # solo emite un aviso y sigue. Ver WORKFLOW-TLS.md (Fase B).
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/app/cert/ca.crt}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - ./cert:/app/cert:ro
    ports:
      # Puerto que el frontend publica en el host.
      #   - Todo en una máquina (dev): 80  → http://localhost
      #   - Laptop del frontend con TLS: 3000 (ver .env.laptop-frontend.example),
      #     porque el 80 lo ocupa el frontend-proxy (Nginx) para redirigir a HTTPS.
      - "${FRONTEND_HOST_PORT:-80}:3000"

  # --------------------------------------------------------------------------
  # Nginx que termina TLS (HTTPS) delante del frontend. Perfil "tls": en el modo
  # "todo en una máquina" (sin COMPOSE_PROFILES) NO se levanta. En la laptop del
  # frontend, su .env trae COMPOSE_PROFILES=tls, así que el perfil queda activo
  # por defecto y el proxy sube (y reinicia) solo. Ver WORKFLOW-TLS.md (Fase A).
  #
  #   Laptop del frontend:  docker compose up -d --build frontend frontend-proxy
  # --------------------------------------------------------------------------
  frontend-proxy:
    image: nginx:1.27-alpine
    container_name: sicad_frontend_proxy
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - frontend
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./cert/sicad.crt:/etc/nginx/certs/sicad.crt:ro
      - ./cert/sicad.key:/etc/nginx/certs/sicad.key:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - sicad.fandite.com

volumes:
  sicad_pgdata:
