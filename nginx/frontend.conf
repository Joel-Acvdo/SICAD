# ============================================================================
# Nginx del FRONTEND — termina TLS (HTTPS) y hace de reverse proxy hacia Next.
#
# Este archivo se monta en /etc/nginx/conf.d/default.conf del contenedor
# "frontend-proxy" (ver docker-compose.yml, perfil "tls").
#
#   Navegador --HTTPS 443--> Nginx --HTTP interno--> frontend:3000 (Next standalone)
#
# El servidor de Next sigue encargándose del proxy /api hacia el backend; aquí
# solo ciframos el tramo que ve el usuario (Fase A). Ver WORKFLOW-TLS.md.
# ============================================================================

# Soporte de WebSocket / Upgrade (Next lo usa en algunos casos). Debe ir en el
# contexto http; al incluirse este archivo dentro de http{}, aquí es válido.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirige todo el tráfico HTTP (80) a HTTPS (443).
server {
    listen 80;
    server_name sicad.fandite.com;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS.
server {
    listen 443 ssl;
    server_name sicad.fandite.com;

    ssl_certificate     /etc/nginx/certs/sicad.crt;
    ssl_certificate_key /etc/nginx/certs/sicad.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Subida de imágenes (fotos de credencial, etc.).
    client_max_body_size 20m;

    # DNS interno de Docker (127.0.0.11). Al usar una VARIABLE en proxy_pass,
    # Nginx resuelve "frontend" EN CADA PETICIÓN (no al arrancar), así que:
    #   - Arranca aunque el contenedor "frontend" todavía no esté listo (reinicio).
    #   - Si el frontend cambia de IP, lo reencuentra (revalida cada 10 s).
    # Sin esto, Nginx muere con "host not found in upstream" al reiniciar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://frontend:3000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
