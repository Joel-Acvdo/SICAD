# ============================================================================
# Nginx del BACKEND — termina TLS (HTTPS) y hace de reverse proxy hacia Express.
#
# Se monta en /etc/nginx/conf.d/default.conf del contenedor "backend-proxy"
# (ver docker-compose.yml, perfil "tls").
#
#   Frontend --HTTPS 443--> Nginx --HTTP interno--> backend:4000 (Express)
#
# El backend Express sigue hablando HTTP en el 4000 dentro de la red de Docker;
# aquí ciframos el tramo entre laptops. Ver WORKFLOW-TLS.md (Fase B).
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirige HTTP (80) a HTTPS (443).
server {
    listen 80;
    server_name backend.fandite.com;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS.
server {
    listen 443 ssl;
    server_name backend.fandite.com;

    ssl_certificate     /etc/nginx/certs/backend.crt;
    ssl_certificate_key /etc/nginx/certs/backend.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # El alta de usuario puede traer una foto en base64.
    client_max_body_size 20m;

    # DNS interno de Docker: resuelve "backend" en cada petición, así Nginx
    # arranca aunque el backend aún no esté listo (reinicio) y reconecta solo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://backend:4000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
